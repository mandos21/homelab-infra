  volumeName: soulsync-staging
  resources: {requests: {storage: 250Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soulsync-transfer
  namespace: soulsync
  annotations: {kustomize.toolkit.fluxcd.io/prune: disabled}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
