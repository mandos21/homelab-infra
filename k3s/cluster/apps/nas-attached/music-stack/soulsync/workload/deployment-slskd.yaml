apiVersion: apps/v1
kind: Deployment
metadata:
  name: slskd
  namespace: soulsync
  labels:
    app.kubernetes.io/name: slskd
    app.kubernetes.io/component: downloader
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: slskd
      app.kubernetes.io/component: downloader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slskd
        app.kubernetes.io/component: downloader
    spec:
      nodeSelector: {node-type: vm}
      terminationGracePeriodSeconds: 30
      securityContext: {fsGroup: 100}
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          env:
            - {name: VPN_SERVICE_PROVIDER, value: private internet access}
            - {name: VPN_TYPE, value: openvpn}
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: soulsync-slskd-secrets
                  key: VPN_USER
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soulsync-slskd-secrets
                  key: VPN_PASS
            - {name: VPN_PORT_FORWARDING, value: "on"}
            - {name: VPN_PORT_FORWARDING_PROVIDER, value: private internet access}
            - {name: SERVER_REGIONS, value: Netherlands}
            - {name: FIREWALL_OUTBOUND_SUBNETS, value: 10.42.0.0/16,10.43.0.0/16,192.168.1.0/24,192.168.3.0/24}
            - {name: HTTP_CONTROL_SERVER_ADDRESS, value: ":8000"}
            - {name: TZ, value: America/New_York}
          volumeMounts:
            - {name: dev-net-tun, mountPath: /dev/net/tun}
        # Temporary diagnostic container. It shares the Pod network namespace,
        # so its traffic exits through Gluetun. Remove after testing.
        - name: speedtest
          image: python:3.14-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              pip install --no-cache-dir speedtest-cli
              && tail -f /dev/null
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
        - name: slskd
          image: slskd/slskd:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: PUID, value: "99"}
            - {name: PGID, value: "100"}
            - {name: SLSKD_REMOTE_CONFIGURATION, value: "false"}
            - {name: SLSKD_REMOTE_FILE_MANAGEMENT, value: "false"}
            - {name: SLSKD_CONFIG, value: /etc/slskd/slskd.yml}
            - {name: SLSKD_SHARED_DIR, value: /music}
            - {name: SLSKD_DOWNLOADS_DIR, value: /downloads}
            - {name: SLSKD_INCOMPLETE_DIR, value: /incomplete}
            - {name: SLSKD_UMASK, value: "022"}
            - {name: TZ, value: America/New_York}
            - name: SLSKD_SLSK_USERNAME
              valueFrom:
                secretKeyRef: {name: soulsync-slskd-secrets, key: SLSKD_SLSK_USERNAME}
            - name: SLSKD_SLSK_PASSWORD
              valueFrom:
                secretKeyRef: {name: soulsync-slskd-secrets, key: SLSKD_SLSK_PASSWORD}
            - name: SLSKD_API_KEY
              valueFrom:
                secretKeyRef: {name: soulsync-slskd-secrets, key: SLSKD_API_KEY}
          ports:
            - {name: http, containerPort: 5030}
            - {name: peer, containerPort: 50300}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: slskd-config, mountPath: /etc/slskd}
            - {name: data, mountPath: /app}
            - {name: downloads, mountPath: /downloads}
            - {name: incomplete, mountPath: /incomplete}
            - {name: music, mountPath: /music, readOnly: true}
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: slskd-config
          configMap:
            name: slskd-config
        - name: data
          persistentVolumeClaim: {claimName: slskd-data}
        - name: downloads
          persistentVolumeClaim: {claimName: soulsync-downloads}
        - name: incomplete
          persistentVolumeClaim: {claimName: soulsync-incomplete}
        - name: music
          persistentVolumeClaim: {claimName: soulsync-transfer}
