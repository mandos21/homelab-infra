apiVersion: apps/v1
kind: Deployment
metadata:
  name: unraid-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: unraid-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unraid-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unraid-exporter
    spec:
      nodeSelector:
        node-type: baremetal
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unraid-exporter
          image: ghcr.io/mandos21/unraid-exporter:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9108
          env:
            - name: UNRAID_GRAPHQL_URL
              value: https://192.168.1.231:4443/graphql
            - name: UNRAID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: unraid-exporter-secrets
                  key: UNRAID_API_KEY
            - name: LISTEN_ADDR
              value: ":9108"
            - name: SCRAPE_TIMEOUT
              value: 10s
            - name: UNRAID_TLS_SKIP_VERIFY
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: unraid-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: unraid-exporter
spec:
  selector:
    app.kubernetes.io/name: unraid-exporter
  ports:
    - name: metrics
      port: 9108
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unraid-exporter
  namespace: observability
  labels:
    release: observability-core
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app.kubernetes.io/name: unraid-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 15s
