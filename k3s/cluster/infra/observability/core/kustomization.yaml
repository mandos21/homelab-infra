apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helm-values-configmap.yaml
  - helmrelease.yaml
  - servicemonitor-longhorn.yaml
  - podmonitor-traefik.yaml
  - secret-unraid-exporter.sops.yaml
  - unraid-exporter.yaml
configMapGenerator:
  - name: grafana-dashboard-kubernetes-cluster-overview
    namespace: observability
    files:
      - dashboards/kubernetes-cluster-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Kubernetes
  - name: grafana-dashboard-unraid-overview
    namespace: observability
    files:
      - dashboards/unraid-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Infrastructure
generatorOptions:
  disableNameSuffixHash: true
